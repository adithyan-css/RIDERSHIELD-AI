services:
  mongodb:
    image: mongo:7
    container_name: ridershield_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ridershield

  redis:
    image: redis:7-alpine
    container_name: ridershield_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ridershield_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build: ./backend
    container_name: ridershield_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - redis
      - mosquitto
    volumes:
      - ./backend:/app

volumes:
  mongo_data:
  redis_data:
